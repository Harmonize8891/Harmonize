<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonize: Mind, Body & Food Prep</title>
    <style>
        :root {
            --bg-color: #F9F6F0;
            --primary-color: #2E5A44;
            --text-color: #1A1A1A;
            --accent-color: #DFD3C3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 80px auto;
            text-align: center;
        }
        .badge {
            background-color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 24px;
            color: var(--primary-color);
        }
        p.subtitle {
            font-size: 1.2rem;
            color: #4A4A4A;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 450px;
            margin: 0 auto;
        }
        @media(min-width: 500px) {
            form { flex-direction: row; }
        }
        input[type="email"] {
            flex: 1;
            padding: 16px;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            font-size: 1rem;
            background-color: #fff;
            outline: none;
        }
        input[type="email"]:focus {
            border-color: var(--primary-color);
        }
        button {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Dinner Without Decision Fatigue</div>
        <h1>Harmonize</h1>
        <p class="subtitle">The first meal planner that checks your calendar, syncs with your fitness tracker, and asks <strong>how you actually feel</strong> before telling you what to cook.</p>
        <form>
            <input type="email" placeholder="Enter your email address" required>
            <button type="submit">Join the Waitlist</button>
        </form>
    </div>
</body>
</html>
